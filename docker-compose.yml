version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-tehyungggg}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-ai-tehyung}
    env_file:
      - .env
    depends_on:
      - db
    # Sync schema lalu start Next.js (safe: hanya tambah tabel baru, tidak hapus data)
    command: sh -c "npx prisma db push --accept-data-loss=false && npm start"

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-ai-tehyung}
    env_file:
      - .env
    depends_on:
      - db
    command: sh -c "npm run cron:reminders"

volumes:
  pgdata:
